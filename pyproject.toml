[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-toolkit"
version = "2.0.0"
description = "Cross-platform System Provisioning & Database Automation CLI"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
]

[project.scripts]
linux-toolkit = "toolkit.app:main"

[tool.setuptools.packages.find]
include = ["toolkit*"]
